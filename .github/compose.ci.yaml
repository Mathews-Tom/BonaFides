# CI-only credential-free relay; PostgreSQL itself remains on the private network.
services:
  db-access:
    image: ${OFFERLOOM_IMAGE:-offerloom-m0:local}
    build: {context: ., target: app}
    user: "10001:10001"
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    pids_limit: 32
    mem_limit: 128m
    cpus: 0.5
    init: true
    restart: "on-failure:3"
    stop_grace_period: 10s
    logging: {driver: json-file, options: {max-size: 5m, max-file: "2"}}
    entrypoint: [python, -m, offerloom.relay]
    command: [db]
    networks: [ingress, private]
    ports: ["127.0.0.1:15432:5432"]
    depends_on: {db: {condition: service_healthy}}
    healthcheck:
      test: [CMD, python, -c, "import socket; socket.create_connection(('127.0.0.1',5432),2).close()"]
      interval: 3s
      timeout: 3s
      retries: 20
