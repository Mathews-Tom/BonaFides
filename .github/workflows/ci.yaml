# SPDX-License-Identifier: MIT OR Apache-2.0
name: BonaFides development gates and runtime proof
# Fast tier: every pull request event that changes code (opened, synchronize, reopened) or adds
# the `full-ci` label. Full tier: push to main, manual dispatch, or a pull request labelled
# `full-ci`. Body edits and other labels run only the contribution check.
on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened, edited, labeled]
  workflow_dispatch:
    inputs:
      release_compliance:
        description: Run the blocking human-rights/public-release gate (not ordinary private CI)
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  # Metadata-only events (body edits, unrelated labels) get their own group so they never cancel
  # a gate run; every other event cancels the stale run for the same ref.
  group: bonafides-${{ github.workflow }}-${{ github.ref }}${{ (github.event.action == 'edited' || (github.event.action == 'labeled' && github.event.label.name != 'full-ci')) && format('-metadata-{0}', github.run_id) || '' }}
  cancel-in-progress: true
jobs:
  contribution:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha }}
      - name: Verify explicit submission authorization and real author DCO trailers
        run: python3 .github/check_contribution.py
  fast:
    name: fast (amd64)
    if: >-
      github.event_name == 'pull_request' && github.event.action != 'edited' &&
      (github.event.action != 'labeled' || github.event.label.name == 'full-ci')
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      DOCKER_DEFAULT_PLATFORM: linux/amd64
      BONAFIDES_IMAGE: bonafides:local
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: ./.github/actions/toolchain
      - name: Frozen host frontend install and frontend gates
        run: |
          test "$(command -v node)" = "$BONAFIDES_NODE_BIN"
          test "$(command -v pnpm)" = "$BONAFIDES_PNPM_BIN"
          pnpm --dir web install --frozen-lockfile
          pnpm --dir web exec tsc --noEmit
          pnpm --dir web lint
          pnpm --dir web test
          pnpm --dir web build
      - name: Build application image for the sealed parser and database relay
        run: docker build --pull --target app --tag bonafides:local .
      - name: Ruff format strict mypy pytest with actual least privilege PostgreSQL
        run: uv run --frozen python .github/backend_gate.py
  gates:
    if: >-
      github.event_name != 'pull_request' ||
      (github.event.action != 'edited' &&
      contains(github.event.pull_request.labels.*.name, 'full-ci') &&
      (github.event.action != 'labeled' || github.event.label.name == 'full-ci'))
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            platform: linux/amd64
            architecture: amd64
          - runner: ubuntu-24.04-arm
            platform: linux/arm64
            architecture: arm64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    env:
      DOCKER_DEFAULT_PLATFORM: ${{ matrix.platform }}
      BONAFIDES_IMAGE: bonafides:local
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: ./.github/actions/toolchain
      - name: Frozen host frontend install and all frontend gates
        run: |
          test "$(command -v node)" = "$BONAFIDES_NODE_BIN"
          test "$(command -v pnpm)" = "$BONAFIDES_PNPM_BIN"
          pnpm --dir web install --frozen-lockfile
          pnpm --dir web exec tsc --noEmit
          pnpm --dir web lint
          pnpm --dir web test
          pnpm --dir web build
          pnpm --dir web audit --audit-level high
      - name: Build shipped application image without ignored planning assets
        run: docker build --pull --target app --tag bonafides:local .
      - name: Ruff format strict mypy pytest with actual least privilege PostgreSQL
        run: uv run --frozen python .github/backend_gate.py
      - name: Source and Python vulnerability gates
        run: |
          mkdir -p artifacts
          uv run --frozen python -m tools.compliance source
          uv run --frozen pip-audit --local --format json --output artifacts/python-vulnerabilities.json
          uv run --frozen pip-licenses --format=json --with-urls --with-authors --output-file artifacts/python-licenses.json
      - name: Exact dependency metadata and SBOM (does not forge rights approval)
        run: |
          test "$(command -v node)" = "$BONAFIDES_NODE_BIN"
          test "$(command -v pnpm)" = "$BONAFIDES_PNPM_BIN"
          test "$(node --version)" = 'v22.23.4'
          test "$(pnpm --version)" = '10.33.3'
          uv run --frozen python tools/inventory.py --uv-lock uv.lock --python-root .venv --web-root web --image bonafides:local --output artifacts/locked-components.json
          uv run --frozen python -m tools.compliance sbom --inventory artifacts/locked-components.json --output artifacts/source-sbom.json
      - name: Pinned image vulnerability secret and SBOM tooling without Docker socket
        run: |
          docker save --output "$RUNNER_TEMP/bonafides-image.tar" bonafides:local
          scanner='aquasec/trivy:0.69.3@sha256:bcc376de8d77cfe086a917230e818dc9f8528e3c852f7b1aff648949b6258d1c'
          status=0
          docker run --rm -v "$RUNNER_TEMP/bonafides-image.tar:/image.tar:ro" -v "$PWD/artifacts:/output" "$scanner" image --input /image.tar --scanners vuln,secret --severity HIGH,CRITICAL --exit-code 1 --format json --output /output/image-vulnerabilities.json || status=$?
          docker run --rm -v "$RUNNER_TEMP/bonafides-image.tar:/image.tar:ro" -v "$PWD/artifacts:/output" "$scanner" image --input /image.tar --format cyclonedx --output /output/image-sbom.json || status=$?
          docker run --rm -v "$PWD:/source:ro" -v "$PWD/artifacts:/output" "$scanner" fs --scanners secret --exit-code 1 --format json --output /output/source-secrets.json --skip-dirs /source/.docs,/source/.local,/source/.secrets,/source/.venv,/source/web/node_modules,/source/artifacts /source || status=$?
          exit "$status"
      - name: Actual auth browser sandbox crash fencing PDF and isolated restore
        run: |
          uv run --frozen python -m tools.runtime_proof \
            --project bonafides-proof-ci-${{ matrix.architecture }} \
            --confirm-disposable bonafides-proof-ci-${{ matrix.architecture }} \
            --platform '${{ matrix.platform }}' --port 18000 --skip-build
      - name: Blocking release compliance only when deliberately requested
        if: github.event_name == 'workflow_dispatch' && inputs.release_compliance
        run: uv run --frozen python -m tools.compliance check --inventory artifacts/locked-components.json --output artifacts/release-compliance.json
      - name: Upload redacted evidence only (never local secret directories)
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: gate-evidence-${{ matrix.architecture }}
          path: |
            artifacts/*.json
            .local/bonafides-proof-ci-${{ matrix.architecture }}/receipt.json
          include-hidden-files: true
          if-no-files-found: error
