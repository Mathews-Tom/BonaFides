# SPDX-License-Identifier: MIT OR Apache-2.0
name: BonaFides development gates and runtime proof
# Fast tier: every pull request that is opened, reopened or receives new commits, or that gets
# the `full-ci` label. Full tier: push to main, manual dispatch, or a pull request labelled
# `full-ci`. Description edits run only `contribution.yaml`, so they never record skipped gate
# rows over current results.
on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened, labeled]
  workflow_dispatch:
    inputs:
      release_compliance:
        description: Run the blocking human-rights/public-release gate (not ordinary private CI)
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  # Labels other than `full-ci` get their own group so they never cancel a gate run; every other
  # event cancels the stale run for the same ref.
  group: bonafides-${{ github.workflow }}-${{ github.ref }}${{ (github.event.action == 'labeled' && github.event.label.name != 'full-ci') && format('-metadata-{0}', github.run_id) || '' }}
  cancel-in-progress: true
jobs:
  fast-checks:
    name: fast lint web and source scan
    if: >-
      github.event_name == 'pull_request' &&
      (github.event.action != 'labeled' || github.event.label.name == 'full-ci')
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: ./.github/actions/toolchain
      - name: Check backend shard partition
        run: uv run --frozen python .github/backend_shards.py
      - name: Ruff format and strict mypy
        run: uv run --frozen python .github/backend_gate.py --lint-only
      - name: Frozen host frontend install and frontend gates
        run: |
          test "$(command -v node)" = "$BONAFIDES_NODE_BIN"
          test "$(command -v pnpm)" = "$BONAFIDES_PNPM_BIN"
          pnpm --dir web install --frozen-lockfile
          pnpm --dir web exec tsc --noEmit
          pnpm --dir web lint
          pnpm --dir web test
          pnpm --dir web build
      - name: Source compliance scan
        run: uv run --frozen python -m tools.compliance source
  fast-backend:
    name: fast backend shard ${{ matrix.shard }}/5
    if: >-
      github.event_name == 'pull_request' &&
      (github.event.action != 'labeled' || github.event.label.name == 'full-ci')
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4, 5]
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      DOCKER_DEFAULT_PLATFORM: linux/amd64
      BONAFIDES_IMAGE: bonafides:local
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: ./.github/actions/toolchain
      - name: Build application image for the sealed parser and database relay
        run: docker build --pull --target app --tag bonafides:local .
      - name: Backend pytest shard with actual least privilege PostgreSQL
        run: |
          paths="$(uv run --frozen python .github/backend_shards.py --shard '${{ matrix.shard }}')"
          mapfile -t tests <<< "$paths"
          equivalence=()
          if [ '${{ matrix.shard }}' = 1 ]; then equivalence=(--schema-equivalence); fi
          uv run --frozen python .github/backend_gate.py "${equivalence[@]}" --pytest-only "${tests[@]}"
  fast:
    name: fast (amd64)
    needs: [fast-checks, fast-backend]
    if: >-
      always() && github.event_name == 'pull_request' &&
      (github.event.action != 'labeled' || github.event.label.name == 'full-ci')
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Require every fast-tier job to succeed
        env:
          CHECKS_RESULT: ${{ needs.fast-checks.result }}
          BACKEND_RESULT: ${{ needs.fast-backend.result }}
        run: |
          test "$CHECKS_RESULT" = success
          test "$BACKEND_RESULT" = success
  gates:
    if: >-
      github.event_name != 'pull_request' ||
      (contains(github.event.pull_request.labels.*.name, 'full-ci') &&
      (github.event.action != 'labeled' || github.event.label.name == 'full-ci'))
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            platform: linux/amd64
            architecture: amd64
          - runner: ubuntu-24.04-arm
            platform: linux/arm64
            architecture: arm64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    env:
      DOCKER_DEFAULT_PLATFORM: ${{ matrix.platform }}
      BONAFIDES_IMAGE: bonafides:local
      TRIVY_IMAGE: aquasec/trivy:0.69.3@sha256:bcc376de8d77cfe086a917230e818dc9f8528e3c852f7b1aff648949b6258d1c
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: ./.github/actions/toolchain
      # The report holds no architecture-specific values; amd64 and arm64 JSON must match.
      - name: Fabrication benchmark report as evidence and job summary
        run: |
          mkdir -p artifacts
          uv run --frozen bonafides benchmark run tests/fixtures/fabrication --output artifacts/fabrication-benchmark.json > "$RUNNER_TEMP/fabrication-benchmark.md"
          tee -a "$GITHUB_STEP_SUMMARY" < "$RUNNER_TEMP/fabrication-benchmark.md"
      - name: Frozen host frontend install and all frontend gates
        run: |
          test "$(command -v node)" = "$BONAFIDES_NODE_BIN"
          test "$(command -v pnpm)" = "$BONAFIDES_PNPM_BIN"
          pnpm --dir web install --frozen-lockfile
          pnpm --dir web exec tsc --noEmit
          pnpm --dir web lint
          pnpm --dir web test
          pnpm --dir web build
          pnpm --dir web audit --audit-level high
      - name: Build shipped application image without ignored planning assets
        run: |
          version="$(uv run --frozen python -c 'import bonafides; print(bonafides.__version__)')"
          revision="$(git rev-parse HEAD)"
          source="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY"
          {
            echo "BONAFIDES_RELEASE_VERSION=$version"
            echo "BONAFIDES_RELEASE_REVISION=$revision"
            echo "BONAFIDES_RELEASE_SOURCE=$source"
          } >> "$GITHUB_ENV"
          docker build --pull --target app --build-arg VERSION="$version" --build-arg REVISION="$revision" \
            --build-arg SOURCE="$source" --tag bonafides:local .
      # Pull-request runs build the merge commit, so their revision is that merge commit's SHA.
      - name: Assert release labels against the image's own reported version
        run: |
          test "$(docker run --rm --network none bonafides:local version)" = "$BONAFIDES_RELEASE_VERSION"
          labels="$(docker image inspect --format '{{json .Config.Labels}}' bonafides:local)"
          test "$(docker image inspect --format '{{.Os}}/{{.Architecture}}' bonafides:local)" = '${{ matrix.platform }}'
          {
            echo '### Release labels (${{ matrix.platform }})'
            echo '| Label | Value |'
            echo '| --- | --- |'
          } >> "$GITHUB_STEP_SUMMARY"
          for key in version revision source; do
            variable="BONAFIDES_RELEASE_${key^^}"
            value="$(jq -r --arg key "org.opencontainers.image.$key" '.[$key] // empty' <<< "$labels")"
            test -n "$value"
            test "$value" = "${!variable}"
            echo "| \`org.opencontainers.image.$key\` | \`$value\` |" >> "$GITHUB_STEP_SUMMARY"
          done
      - name: Ruff format strict mypy pytest with actual least privilege PostgreSQL
        run: uv run --frozen python .github/backend_gate.py --schema-equivalence
      - name: Source and Python vulnerability gates
        run: |
          mkdir -p artifacts
          uv run --frozen python -m tools.compliance source
          uv run --frozen pip-audit --local --format json --output artifacts/python-vulnerabilities.json
          uv run --frozen pip-licenses --format=json --with-urls --with-authors --output-file artifacts/python-licenses.json
      - name: Exact dependency metadata and SBOM (does not forge rights approval)
        run: |
          test "$(command -v node)" = "$BONAFIDES_NODE_BIN"
          test "$(command -v pnpm)" = "$BONAFIDES_PNPM_BIN"
          test "$(node --version)" = 'v22.23.4'
          test "$(pnpm --version)" = '10.33.3'
          uv run --frozen python tools/inventory.py --uv-lock uv.lock --python-root .venv --web-root web --image bonafides:local --output artifacts/locked-components.json
          uv run --frozen python -m tools.compliance sbom --inventory artifacts/locked-components.json --output artifacts/source-sbom.json
      - name: Pinned image vulnerability secret and SBOM tooling without Docker socket
        run: |
          docker save --output "$RUNNER_TEMP/bonafides-image.tar" bonafides:local
          scanner="$TRIVY_IMAGE"
          status=0
          docker run --rm -v "$RUNNER_TEMP/bonafides-image.tar:/image.tar:ro" -v "$PWD/artifacts:/output" "$scanner" image --input /image.tar --scanners vuln,secret --severity HIGH,CRITICAL --exit-code 1 --format json --output /output/image-vulnerabilities.json || status=$?
          docker run --rm -v "$RUNNER_TEMP/bonafides-image.tar:/image.tar:ro" -v "$PWD/artifacts:/output" "$scanner" image --input /image.tar --format cyclonedx --output /output/image-sbom.json || status=$?
          docker run --rm -v "$PWD:/source:ro" -v "$PWD/artifacts:/output" "$scanner" fs --scanners secret --exit-code 1 --format json --output /output/source-secrets.json --skip-dirs /source/.docs,/source/.local,/source/.secrets,/source/.venv,/source/web/node_modules,/source/artifacts /source || status=$?
          exit "$status"
      - name: Deliberate synthetic violations fail the actual secret and license gates
        # Synthetic repositories and raw scanner output stay under RUNNER_TEMP, never an uploaded path.
        run: |
          uv run --frozen python -m tools.gate_controls --scratch "$RUNNER_TEMP/gate-controls" \
            --scanner "$TRIVY_IMAGE" --output artifacts/gate-controls.json
      - name: Verify saved layers locally and export only manifest and config metadata
        run: |
          saved="$RUNNER_TEMP/release-saved"
          metadata="$RUNNER_TEMP/release-platform"
          mkdir "$saved"
          tar -xf "$RUNNER_TEMP/bonafides-image.tar" -C "$saved"
          uv run --frozen python -m tools.release_index strip \
            --version "$BONAFIDES_RELEASE_VERSION" --revision "$BONAFIDES_RELEASE_REVISION" \
            --source "$BONAFIDES_RELEASE_SOURCE" --layout "${{ matrix.architecture }}=$saved" \
            --output "$metadata"
          tar -cf "$RUNNER_TEMP/bonafides-platform-metadata.tar" -C "$metadata" .
      - name: Upload platform manifests and configs only (no image layers)
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: release-platform-${{ matrix.architecture }}
          path: ${{ runner.temp }}/bonafides-platform-metadata.tar
          retention-days: 3
          compression-level: 1
          if-no-files-found: error
      - name: Actual auth browser sandbox crash fencing PDF and isolated restore
        run: |
          uv run --frozen python -m tools.runtime_proof \
            --project bonafides-proof-ci-${{ matrix.architecture }} \
            --confirm-disposable bonafides-proof-ci-${{ matrix.architecture }} \
            --platform '${{ matrix.platform }}' --port 18000 --skip-build
      - name: Separate install and start to SPA shell, stopped reinstall and image swap
        run: |
          uv run --frozen python -m tools.install_proof \
            --project bonafides-proof-install-${{ matrix.architecture }} \
            --confirm-disposable bonafides-proof-install-${{ matrix.architecture }} \
            --platform '${{ matrix.platform }}' --port 18100 --image bonafides:local
          jq -r '.checks | to_entries[] | "| \(.key) | \(.value.install_and_start_seconds // .value.install_and_start_to_spa_shell_seconds) s |"' \
            ".local/bonafides-proof-install-${{ matrix.architecture }}/receipt.json" > "$RUNNER_TEMP/install-seconds.md"
          {
            echo '### Install and start receipt (${{ matrix.platform }}, limit 600 s)'
            echo '| Check | Install and start to served SPA shell |'
            echo '| --- | --- |'
            cat "$RUNNER_TEMP/install-seconds.md"
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Release-image core loop in production mode with the explicit fixture model
        run: |
          uv run --frozen python -m tools.core_loop_proof \
            --project bonafides-proof-core-${{ matrix.architecture }} \
            --confirm-disposable bonafides-proof-core-${{ matrix.architecture }} \
            --platform '${{ matrix.platform }}' --port 18200 --image bonafides:local
          {
            echo '### Core-loop receipt (${{ matrix.platform }}, deterministic fixture model)'
            echo '| Check | Seconds since start |'
            echo '| --- | --- |'
            jq -r '.checks | to_entries | sort_by(.value.elapsed_seconds)[] | "| \(.key) | \(.value.elapsed_seconds) |"' \
              ".local/bonafides-proof-core-${{ matrix.architecture }}/receipt.json"
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Blocking release compliance only when deliberately requested
        if: github.event_name == 'workflow_dispatch' && inputs.release_compliance
        run: uv run --frozen python -m tools.compliance check --inventory artifacts/locked-components.json --output artifacts/release-compliance.json
      - name: Upload redacted evidence only (never local secret directories)
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: gate-evidence-${{ matrix.architecture }}
          path: |
            artifacts/*.json
            .local/bonafides-proof-ci-${{ matrix.architecture }}/receipt.json
            .local/bonafides-proof-install-${{ matrix.architecture }}/receipt.json
            .local/bonafides-proof-core-${{ matrix.architecture }}/receipt.json
          include-hidden-files: true
          if-no-files-found: error
  release-index:
    # Public artifacts contain only manifests, configs and index metadata, never image layers.
    # All layer bytes stay on their native runner; no registry login, push or packages permission.
    name: release image index (local, no push)
    needs: gates
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: release-platform-*
          path: ${{ runner.temp }}/release
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: gate-evidence-*
          path: ${{ runner.temp }}/evidence
      - name: Assemble and inspect the two-platform index tagged with the version and commit
        run: |
          python3 -c 'import sys; assert sys.version_info[:2] == (3, 12), sys.version'
          release="$RUNNER_TEMP/release"
          for architecture in amd64 arm64; do
            mkdir "$release/$architecture"
            tar -xf "$release/release-platform-$architecture/bonafides-platform-metadata.tar" -C "$release/$architecture"
            rm -r "$release/release-platform-$architecture"
          done
          identity=(
            --version "$(python3 -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])')"
            --revision "$(git rev-parse HEAD)"
            --source "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY"
            --output "$release/index"
          )
          python3 -m tools.release_index assemble "${identity[@]}" \
            --layout "amd64=$release/amd64" --layout "arm64=$release/arm64"
          python3 -m tools.release_index inspect "${identity[@]}" --metadata-only > "$release/index-report.json"
          cat "$release/index-report.json"
          {
            echo '### Release index metadata (no image layers; not pushed)'
            jq -r '"Index `\(.index_digest)` tagged " + (.tags | map("`\(.)`") | join(", "))' "$release/index-report.json"
            echo
            echo '| Platform | Manifest digest |'
            echo '| --- | --- |'
            jq -r '.platforms | to_entries[] | "| linux/\(.key) | `\(.value)` |"' "$release/index-report.json"
            echo
            echo 'Layer descriptors are unverified here but were sha256/size-verified on their native runner before omission.'
          } >> "$GITHUB_STEP_SUMMARY"
          tar -cf "$release/bonafides-index.tar" -C "$release/index" .
      - name: Upload index manifests and configs only (no image layers)
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: release-image-index
          path: |
            ${{ runner.temp }}/release/bonafides-index.tar
            ${{ runner.temp }}/release/index-report.json
          retention-days: 3
          compression-level: 1
          if-no-files-found: error
      - name: Install pinned cosign with a verified checksum
        run: |
          version=3.1.4
          sha256=424e2c97d0b45fd7a6b608a87f090f35633f4c23ece5f092d48bba11aaf4bbfa
          bin="$RUNNER_TEMP/cosign-bin"
          mkdir "$bin"
          curl --fail --silent --show-error --location --output "$bin/cosign" \
            "https://github.com/sigstore/cosign/releases/download/v$version/cosign-linux-amd64"
          echo "$sha256  $bin/cosign" | sha256sum --check --strict
          chmod 0755 "$bin/cosign"
          test "$("$bin/cosign" version | awk '/GitVersion/ {print $2}')" = "v$version"
          echo "$bin" >> "$GITHUB_PATH"
      - name: Bind evidence to the exact images, sign with a disposable proof key and attempt tampering
        # Private keys and tampered copies stay under RUNNER_TEMP/candidate-private, never uploaded.
        # The proof key is non-production; verification below trusts only the public key passed in.
        run: |
          release="$RUNNER_TEMP/release"
          evidence="$RUNNER_TEMP/evidence"
          candidate="$RUNNER_TEMP/candidate"
          inputs=(
            --version "$(python3 -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])')"
            --revision "$(git rev-parse HEAD)"
            --source "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY"
            --index "$release/index"
            --evidence "amd64=$evidence/gate-evidence-amd64" --evidence "arm64=$evidence/gate-evidence-arm64"
          )
          python3 -m tools.candidate_proof "${inputs[@]}" \
            --private "$RUNNER_TEMP/candidate-private" --output "$candidate"
          python3 -m tools.release_candidate verify "${inputs[@]}" \
            --manifest "$candidate/release-candidate.json" \
            --trusted-public-key "$candidate/proof-public-key.pub" \
            --bundle "$candidate/release-candidate.sigstore.json"
          {
            echo '### Release candidate (disposable proof key; non-production; no release authorized)'
            echo '| Tampered input | Result |'
            echo '| --- | --- |'
            jq -r '.negative_cases[] | "| \(.case) | \(.result) |"' "$candidate/candidate-proof.json"
            echo
            echo 'Signature made and verified locally with cosign; no certificate, timestamp or transparency-log service was contacted. Human approvals remain pending.'
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Upload candidate manifest, signature bundle, proof public key and report only
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: release-candidate-proof
          path: ${{ runner.temp }}/candidate
          retention-days: 3
          compression-level: 1
          if-no-files-found: error
