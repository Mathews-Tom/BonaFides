# SPDX-License-Identifier: MIT OR Apache-2.0
name: BonaFides scheduled dependency and image audit
# Rescans the locked Python and web dependencies and a freshly built amd64 image against current
# advisory data with the pinned gate tools. It never runs on pull requests, so a new advisory is
# reported here without gating contributions: any finding is listed in the job summary and fails
# this run.
on:
  schedule:
    - cron: '23 5 * * 1'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: bonafides-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false
jobs:
  audit:
    name: scheduled audit (amd64)
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      DOCKER_DEFAULT_PLATFORM: linux/amd64
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: ./.github/actions/toolchain
      - name: Python dependencies with pip-audit
        id: python
        continue-on-error: true
        run: |
          mkdir -p artifacts
          uv run --frozen pip-audit --local --format markdown --output artifacts/python-audit.md
      - name: Web dependencies with pnpm audit at high and above
        id: web
        continue-on-error: true
        run: |
          pnpm --dir web install --frozen-lockfile
          pnpm --dir web audit --audit-level high > artifacts/web-audit.txt
      - name: Build the application image
        id: build
        run: |
          version="$(uv run --frozen python -c 'import bonafides; print(bonafides.__version__)')"
          docker build --pull --target app --build-arg VERSION="$version" \
            --build-arg REVISION="$(git rev-parse HEAD)" --build-arg SOURCE="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY" \
            --tag bonafides:audit .
          docker save --output "$RUNNER_TEMP/bonafides-image.tar" bonafides:audit
      - name: Image vulnerabilities with the pinned Trivy
        id: image
        continue-on-error: true
        run: |
          scanner="$(jq -r '.images.trivy.reference' deploy/images.json)"
          trivy=(docker run --rm -v "$RUNNER_TEMP/bonafides-image.tar:/image.tar:ro" -v "$PWD/artifacts:/output" "$scanner")
          status=0
          "${trivy[@]}" image --input /image.tar --scanners vuln --severity HIGH,CRITICAL --exit-code 1 --format json --output /output/image-vulnerabilities.json || status=$?
          "${trivy[@]}" convert --format table --output /output/image-vulnerabilities.txt /output/image-vulnerabilities.json
          exit "$status"
      - name: Report every audit result in the job summary
        if: always()
        env:
          PYTHON_RESULT: ${{ steps.python.outcome }}
          WEB_RESULT: ${{ steps.web.outcome }}
          BUILD_RESULT: ${{ steps.build.outcome }}
          IMAGE_RESULT: ${{ steps.image.outcome }}
        run: |
          {
            echo "### Scheduled audit of \`$(git rev-parse HEAD)\`"
            echo '| Scan | Result |'
            echo '| --- | --- |'
            echo "| Python (pip-audit) | $PYTHON_RESULT |"
            echo "| Web (pnpm audit, high+) | $WEB_RESULT |"
            echo "| Image build | $BUILD_RESULT |"
            echo "| Image (Trivy, HIGH/CRITICAL) | $IMAGE_RESULT |"
            for report in artifacts/python-audit.md artifacts/web-audit.txt artifacts/image-vulnerabilities.txt; do
              if [ -s "$report" ]; then
                printf '\n<details><summary>%s</summary>\n\n```text\n' "$report"
                cat "$report"
                printf '\n```\n</details>\n'
              fi
            done
          } >> "$GITHUB_STEP_SUMMARY"
          for result in "$PYTHON_RESULT" "$WEB_RESULT" "$BUILD_RESULT" "$IMAGE_RESULT"; do
            test "$result" = success
          done
      - name: Upload audit reports
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: scheduled-audit
          path: artifacts/
          retention-days: 30
          if-no-files-found: warn
