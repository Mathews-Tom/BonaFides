# Include /nginx-shared/bonafides.conf inside CapRover's base NGINX http block.
# Replace domain, project alias and operator-managed certificate filenames.
# Requires the existing attachable captain-overlay-network and same-node captain-nginx.
server {
    listen 80;
    server_name career.example;
    return 308 https://career.example$request_uri;
}
server {
    listen 443 ssl;
    server_name career.example;
    ssl_certificate /nginx-shared/bonafides-fullchain.pem;
    ssl_certificate_key /nginx-shared/bonafides-privkey.pem;
    resolver 127.0.0.11 valid=10s ipv6=off;
    # The API applies route-specific limits, including portable workspace archives.
    client_max_body_size 0;
    location / {
        # Preserve the API's early authentication and bounded streaming admission.
        proxy_http_version 1.1;
        proxy_request_buffering off;
        set $bonafides_upstream http://bonafides-ingress:8000;
        proxy_pass $bonafides_upstream;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Proto https;
    }
}
