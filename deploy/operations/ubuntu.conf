# Existing host NGINX; replace career.example, certificate paths and loopback port.
server {
    listen 80;
    server_name career.example;
    return 308 https://career.example$request_uri;
}
server {
    listen 443 ssl;
    server_name career.example;
    ssl_certificate /etc/bonafides-tls/fullchain.pem;
    ssl_certificate_key /etc/bonafides-tls/privkey.pem;
    # The API applies route-specific limits, including portable workspace archives.
    client_max_body_size 0;
    location / {
        # Preserve the API's early authentication and bounded streaming admission.
        proxy_http_version 1.1;
        proxy_request_buffering off;
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Proto https;
    }
}
