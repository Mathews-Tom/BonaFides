# Dokploy Traefik File System dynamic file. Replace domain, project alias and resolver.
http:
  routers:
    bonafides-web:
      rule: Host(`career.example`)
      entryPoints: [web]
      middlewares: [bonafides-redirect]
      service: bonafides
    bonafides-websecure:
      rule: Host(`career.example`)
      entryPoints: [websecure]
      service: bonafides
      tls: {certResolver: letsencrypt}
  middlewares:
    bonafides-redirect:
      redirectScheme: {scheme: https, permanent: true}
  services:
    bonafides:
      loadBalancer:
        passHostHeader: true
        servers: [{url: "http://bonafides-ingress:8000"}]
